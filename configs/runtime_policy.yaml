  active_snapshot: "graph_v4"
  temperature_calibration: 0.84
  thresholds:
    tau_allow: 0.35
    tau_block: 0.70
    tau_uncertainty: 0.45
  feature_extractor:
    dimension: 394
    semantic_encoder: "sentence-transformers/all-MiniLM-L6-v2"
